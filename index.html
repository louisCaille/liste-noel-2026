<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste de Noël 2026 · Louis</title>
<meta name="description" content="La liste de Noël 2026 de Louis.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --fg: #f5f5f7;
    --muted: #86868b;
    --gold: #f5c66b;
    --red: #e3324a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }

  /* ---------- Neige + barre de progression ---------- */
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 50;
    background: linear-gradient(90deg, var(--red), var(--gold));
    transform-origin: left; transform: scaleX(0);
  }
  main { position: relative; z-index: 1; }

  /* ---------- Hero ---------- */
  .hero { height: 200vh; position: relative; }
  .hero .sticky {
    position: sticky; top: 0; height: 100vh; height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px; overflow: hidden;
  }
  .hero .glow {
    position: absolute; width: 80vmax; height: 80vmax; border-radius: 50%;
    background: radial-gradient(circle, rgba(227,50,74,.35), rgba(245,198,107,.12) 40%, transparent 70%);
    filter: blur(40px);
    transform: scale(calc(1 + var(--h, 0) * 0.8));
    opacity: calc(1 - var(--h, 0) * 0.6);
  }
  .hero .eyebrow {
    position: relative; font-size: clamp(14px, 1.6vw, 20px); font-weight: 600;
    letter-spacing: .3em; text-transform: uppercase; color: var(--gold);
    opacity: calc(1 - var(--h, 0) * 2);
    animation: rise 1.2s .2s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero h1 {
    position: relative; font-size: clamp(48px, 11vw, 168px); font-weight: 900;
    line-height: .95; letter-spacing: -0.045em; margin: 20px 0 28px;
    background: linear-gradient(180deg, #fff 30%, #9a9aa3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transform: scale(calc(1 - var(--h, 0) * 0.35)) translateY(calc(var(--h, 0) * -60px));
    opacity: calc(1 - var(--h, 0) * 1.3);
    animation: rise 1.4s .35s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero h1 span {
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  .hero p.lead {
    position: relative; font-size: clamp(18px, 2.2vw, 28px); color: var(--muted); max-width: 640px;
    opacity: calc(1 - var(--h, 0) * 2.2);
    animation: rise 1.4s .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .countdown {
    position: relative; display: flex; gap: clamp(16px, 4vw, 48px); margin-top: 48px;
    opacity: calc(1 - var(--h, 0) * 2.5);
    animation: rise 1.4s .85s cubic-bezier(.2,.8,.2,1) both;
  }
  .countdown div { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
  .countdown b { font-size: clamp(32px, 5vw, 56px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .countdown small { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .2em; margin-top: 4px; }
  .scroll-hint {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: var(--muted); letter-spacing: .15em; text-transform: uppercase;
    opacity: calc(1 - var(--h, 0) * 5);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .scroll-hint i { width: 1px; height: 40px; background: linear-gradient(var(--fg), transparent); animation: drip 2s ease-in-out infinite; }

  @keyframes rise { from { opacity: 0; transform: translateY(40px); filter: blur(10px); } to { filter: blur(0); } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* ---------- Sections cadeaux ---------- */
  .item { height: 300vh; position: relative; }
  .item .sticky {
    position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
    display: grid; grid-template-columns: 1.1fr 1fr; align-items: center;
    gap: 4vw; padding: 0 max(16px, 7vw);
    opacity: calc(1 - var(--out, 0));
    transform: scale(calc(1 - var(--out, 0) * 0.08));
  }
  .item:nth-of-type(even) .sticky { grid-template-columns: 1fr 1.1fr; }
  .item:nth-of-type(even) .visual { order: 2; }
  .item .bg {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 60% at var(--gx, 30%) 50%, var(--accent-soft), transparent 70%);
    opacity: var(--in, 0);
  }
  .visual {
    position: relative; display: flex; align-items: center; justify-content: center; height: 70vh;
    transform: translateY(calc((1 - var(--in, 0)) * 25vh)) scale(calc(0.7 + var(--in, 0) * 0.3)) rotate(calc((1 - var(--in, 0)) * -12deg));
    opacity: var(--in, 0);
  }
  .visual svg { height: 100%; max-width: 100%; overflow: visible; filter: drop-shadow(0 40px 60px rgba(0,0,0,.6)); }
  .text { position: relative; }
  .reveal {
    --r: clamp(0, calc((var(--in, 0) - var(--d, 0)) / (1 - var(--d, 0))), 1);
    opacity: var(--r);
    transform: translateY(calc((1 - var(--r)) * 50px));
    filter: blur(calc((1 - var(--r)) * 8px));
  }
  .tag {
    display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent);
  }
  .text h2 {
    font-size: clamp(40px, 6.5vw, 96px); font-weight: 800; line-height: 1; letter-spacing: -0.04em;
    margin: 16px 0 20px;
  }
  .text h2 em, .mini h3 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .text p { font-size: clamp(17px, 1.6vw, 22px); line-height: 1.5; color: var(--muted); max-width: 520px; }
  .text p strong { color: var(--fg); font-weight: 600; }
  .specs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; list-style: none; }
  .specs li {
    font-size: 14px; padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
  }
  .cta {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; padding: 14px 24px;
    border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 16px;
    background: var(--fg); color: #000; transition: transform .2s, box-shadow .2s;
  }
  .cta:hover { transform: scale(1.04); box-shadow: 0 0 40px var(--accent-soft); }

  /* Animations internes aux visuels */
  .ring { stroke-dasharray: 503; stroke-dashoffset: calc(503px * (1 - var(--in, 0))); transition: stroke-dashoffset .1s; }
  .bud-l { transform: translateX(calc((1 - var(--in, 0)) * -140px)) rotate(calc((1 - var(--in, 0)) * -40deg)); transform-box: fill-box; transform-origin: center; }
  .bud-r { transform: translateX(calc((1 - var(--in, 0)) * 140px)) rotate(calc((1 - var(--in, 0)) * 40deg)); transform-box: fill-box; transform-origin: center; }
  .band { stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--in, 0)); }
  .waves path { animation: wave 1.5s ease-out infinite; opacity: 0; }
  .waves path:nth-child(2) { animation-delay: .25s; }
  .waves path:nth-child(3) { animation-delay: .5s; }
  @keyframes wave { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; } }
  .steam path { animation: steam 3s ease-in-out infinite; opacity: 0; }
  .steam path:nth-child(2) { animation-delay: 1s; }
  .steam path:nth-child(3) { animation-delay: 2s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(20px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-40px); } }
  .pulse { animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.25); } }

  /* Cartes à collectionner (génériques) */
  .fan { position: relative; container-type: inline-size; width: min(340px, 70vw); aspect-ratio: 63 / 88; perspective: 1200px; }
  .tcard {
    position: absolute; inset: 0; border-radius: 18px; padding: 10px;
    background: linear-gradient(145deg, #ffe27a, #e8a93a);
    box-shadow: 0 30px 60px rgba(0,0,0,.55);
    transform-origin: 50% 110%;
    transform: rotate(calc(var(--i) * 16deg * var(--in, 0))) translateX(calc(var(--i) * 9cqw * var(--in, 0)));
  }
  .tcard.front { transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transition: transform .15s ease-out; }
  .tcard .inner {
    position: relative; height: 100%; border-radius: 10px; overflow: hidden;
    background: linear-gradient(180deg, var(--c1), var(--c2));
    display: flex; flex-direction: column; padding: 10px; gap: 8px; color: #1a1a1a;
  }
  .tcard .top { display: flex; justify-content: space-between; font-weight: 800; font-size: clamp(8px, 5.5cqw, 15px); white-space: nowrap; gap: 4px; }
  .tcard .art {
    flex: 0 0 45%; border-radius: 6px; border: 3px solid #d9b34a;
    background: radial-gradient(circle at 50% 60%, #fff8 0 18%, transparent 19%), radial-gradient(circle at 30% 30%, var(--c3), var(--c4));
    display: grid; place-items: center; font-size: 22cqw;
  }
  .tcard .line { height: 10px; border-radius: 5px; background: rgba(0,0,0,.18); }
  .tcard .line.s { width: 60%; }
  .tcard .holo {
    position: absolute; inset: 0; border-radius: 18px; pointer-events: none; mix-blend-mode: color-dodge;
    background: linear-gradient(115deg, transparent 20%, #ff5ec4 35%, #5ef0ff 45%, #b6ff5e 55%, #ffe65e 65%, transparent 80%);
    background-size: 250% 250%;
    background-position: var(--mx, 50%) var(--my, 50%);
    opacity: .55;
  }

  .rise { transform: translateY(calc((1 - var(--in, 0)) * 40px)); }
  .fill { transform: scaleY(calc(0.15 + var(--in, 0) * 0.7)); transform-box: fill-box; transform-origin: bottom; }
  .gc1, .gc2 { transform-box: fill-box; transform-origin: center; }
  .gc1 { transform: translate(calc(var(--in, 0) * -40px), calc(var(--in, 0) * -22px)) rotate(calc(var(--in, 0) * -12deg)); }
  .gc2 { transform: translate(calc(var(--in, 0) * 40px), calc(var(--in, 0) * 22px)) rotate(calc(var(--in, 0) * 6deg)); }

  /* ---------- Transition ---------- */
  .divider { height: 200vh; position: relative; }
  .divider .sticky {
    position: sticky; top: 0; height: 100vh; height: 100svh;
    display: grid; place-items: center; text-align: center; padding: 0 16px;
    opacity: calc(1 - var(--out, 0));
  }
  .divider h2 { font-size: clamp(48px, 10vw, 150px); font-weight: 900; letter-spacing: -0.045em; line-height: 1; }
  .divider h2 em {
    font-style: normal;
    background: linear-gradient(90deg, var(--red), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- Petits cadeaux (2 par écran) ---------- */
  .group { height: 250vh; position: relative; }
  .group .sticky {
    position: sticky; top: 0; height: 100vh; height: 100svh;
    display: flex; align-items: center; justify-content: center; padding: 0 max(16px, 5vw);
    opacity: calc(1 - var(--out, 0));
    transform: scale(calc(1 - var(--out, 0) * 0.08));
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; max-width: 1200px; }
  .mini {
    position: relative; overflow: hidden; border-radius: 32px; padding: 32px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    display: flex; flex-direction: column; gap: 20px;
  }
  .mglow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 50% at 50% 25%, var(--accent-soft), transparent 70%); }
  .mv { position: relative; height: 32vh; display: flex; align-items: center; justify-content: center; }
  .mv svg { height: 100%; max-width: 100%; overflow: visible; filter: drop-shadow(0 24px 40px rgba(0,0,0,.6)); }
  .mv .fan { width: calc(26vh * 63 / 88); }
  .mt { position: relative; }
  .mini h3 { font-size: clamp(26px, 2.8vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 10px 0; }
  .mini p { color: var(--muted); font-size: 16px; line-height: 1.45; }
  .mini p strong { color: var(--fg); font-weight: 600; }
  .mfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 16px; }
  .budget, .tb {
    font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    background: var(--accent-soft, rgba(255,255,255,.08)); color: var(--accent);
  }
  .mfoot a { font-size: 15px; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.3); padding-bottom: 2px; }
  .mfoot a:hover { border-color: var(--accent); }

  /* ---------- Récap ---------- */
  .recap { min-height: 100vh; min-height: 100svh; padding: 20vh max(16px, 7vw) 12vh; text-align: center; position: relative; }
  .recap h2 {
    font-size: clamp(44px, 8vw, 120px); font-weight: 900; letter-spacing: -0.045em; line-height: 1;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  .recap > p { color: var(--muted); font-size: clamp(17px, 2vw, 24px); margin: 20px auto 64px; max-width: 600px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; text-align: left; }
  .tile {
    padding: 28px; border-radius: 24px; text-decoration: none; display: block;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, background .3s;
    opacity: 0; transform: translateY(40px);
  }
  .tile.on { opacity: 1; transform: none; }
  .tile:hover { transform: translateY(-6px); border-color: var(--accent); background: rgba(255,255,255,.07); }
  .tile .e { font-size: 40px; }
  .tile h3 { font-size: 20px; margin: 16px 0 6px; letter-spacing: -0.01em; }
  .tile p { color: var(--muted); font-size: 15px; line-height: 1.4; }
  .tile .tb { display: inline-block; margin-top: 14px; font-size: 13px; background: rgba(255,255,255,.07); }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 16px 60px; position: relative; }

  /* ---------- Mobile ---------- */
  @media (max-width: 820px) {
    .item .sticky, .item:nth-of-type(even) .sticky {
      grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 8px;
      padding-top: 24px; padding-bottom: 24px;
    }
    .item:nth-of-type(even) .visual { order: 0; }
    .visual { height: 34svh; }
    .text { text-align: center; }
    .text h2 { font-size: clamp(32px, 9.5vw, 56px); margin: 10px 0 12px; }
    .text p { margin: 0 auto; font-size: 16px; }
    .specs { justify-content: center; margin-top: 16px; gap: 6px; }
    .specs li { font-size: 13px; padding: 6px 12px; }
    .cta { margin-top: 18px; padding: 12px 20px; font-size: 15px; }
    .fan { width: min(200px, 50vw, calc(30svh * 63 / 88)); }
    .pair { grid-template-columns: 1fr; gap: 12px; }
    .mini { flex-direction: row; align-items: center; padding: 16px; gap: 14px; border-radius: 24px; }
    .mglow { background: radial-gradient(60% 80% at 15% 50%, var(--accent-soft), transparent 70%); }
    .mv { flex: 0 0 34%; height: 20svh; }
    .mv .fan { width: calc(11svh * 63 / 88); }
    .mini .tag { font-size: 11px; letter-spacing: .12em; }
    .mini h3 { font-size: 22px; margin: 6px 0; }
    .mini p { font-size: 14px; line-height: 1.4; }
    .mfoot { margin-top: 10px; gap: 8px 12px; }
    .budget { font-size: 12px; padding: 4px 10px; }
    .mfoot a { font-size: 13px; }
  }
  /* Petits écrans (iPhone SE...) : on allège */
  @media (max-width: 820px) and (max-height: 720px) {
    .visual { height: 28svh; }
    .fan { width: calc(24svh * 63 / 88); }
    .specs { display: none; }
    .mv { height: 16svh; }
    .mv .fan { width: calc(9svh * 63 / 88); }
    .mini p { font-size: 13px; }
  }

  /* ---------- Bouton musique ---------- */
  .music {
    position: fixed; z-index: 60;
    right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 16px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(20,20,26,.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: var(--fg); font: 600 14px Inter, system-ui, sans-serif; cursor: pointer;
    transition: transform .2s, border-color .2s;
    animation: rise 1s 1.6s cubic-bezier(.2,.8,.2,1) both;
  }
  .music:hover { transform: scale(1.05); border-color: var(--gold); }
  .music .bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .music .bars i { width: 3px; height: 30%; border-radius: 2px; background: var(--gold); }
  .music.on .bars i { animation: eq 1s ease-in-out infinite; }
  .music.on .bars i:nth-child(2) { animation-delay: -.3s; }
  .music.on .bars i:nth-child(3) { animation-delay: -.6s; }
  .music.on .bars i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  @media (max-width: 820px) {
    .music.played { padding: 0; width: 48px; justify-content: center; }
    .music.played .label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="progress"></div>
<button class="music" id="music" aria-pressed="false" aria-label="Jouer la musique de Noël">
  <span class="bars"><i></i><i></i><i></i><i></i></span><span class="label">Musique</span>
</button>

<main>
  <section class="hero" id="hero">
    <div class="sticky">
      <div class="glow"></div>
      <div class="eyebrow">La liste de Louis · Noël 2026</div>
      <h1>Cher<br><span>Père Noël,</span></h1>
      <p class="lead">Cette année, j'ai été (presque) très sage. Voici quelques idées.</p>
      <div class="countdown" id="countdown"></div>
      <div class="scroll-hint">Défiler<i></i></div>
    </div>
  </section>

  <div id="items"></div>

  <section class="recap" id="recap">
    <h2>Joyeux Noël&nbsp;!</h2>
    <p>La liste en un coup d'œil. Merci d'avance, je vous aime&nbsp;❤️</p>
    <div class="grid" id="grid"></div>
  </section>
  <footer>La liste de Louis · Fait avec amour (et un peu de neige) · 2026</footer>
</main>

<script>
/* =========================================================
   LA LISTE — ajoutez / modifiez vos cadeaux ici.
   - un objet seul        → un grand cadeau, un écran entier
   - { divider: "..." }   → un écran de transition
   - { group: [ ... ] }   → petits cadeaux, 2 par écran
   visual : "watch" | "earbuds" | "kettle" | "cards" | "box" | "pouch"
            | "bottle" | "battery" | "giftcard" | ou un emoji (ex : "📚")
   ========================================================= */
const ITEMS = [
  {
    emoji: "⌚",
    visual: "watch",
    tag: "Pour courir",
    title: "Une montre de <em>sport</em>",
    desc: "GPS, cardio, et ma musique au poignet pour courir sans téléphone. Par exemple la <strong>Garmin Forerunner 165 Music</strong>.",
    specs: ["GPS intégré", "Écran AMOLED", "Musique embarquée", "Suivi du sommeil"],
    link: "https://www.google.com/search?q=Garmin+Forerunner+165+Music",
    accent: "#3ee6a8", accent2: "#36b3ff",
  },
  {
    emoji: "🎧",
    visual: "earbuds",
    tag: "Pour la motivation",
    title: "Des écouteurs <em>de sport</em>",
    desc: "À <strong>conduction osseuse</strong> ou <strong>open-ear</strong> : les oreilles restent libres pour entendre ce qui se passe autour en courant.",
    specs: ["Conduction osseuse", "Open-ear", "Résistants à la sueur", "Bon maintien"],
    link: "https://www.google.com/search?q=%C3%A9couteurs+sport+conduction+osseuse+open-ear",
    accent: "#8b7bff", accent2: "#ff6bd6",
  },
  {
    emoji: "🫖",

/* ---------- Rendu ---------- */
const hexToRgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

const accentStyle = it => `--accent:${it.accent};--accent2:${it.accent2};--accent-soft:${hexToRgba(it.accent, .22)}`;
const visualOf = (it, size) => VISUALS[it.visual]
  ? VISUALS[it.visual]()
  : `<div style="font-size:${size};line-height:1">${it.visual || it.emoji}</div>`;
const linksOf = it => it.links || (it.link ? [["Voir des idées →", it.link]] : []);
const tiles = [];

const renderBig = (it, i) => {
  tiles.push({ ...it, href: `#s-${i}` });
  return `
  <section class="item" id="s-${i}" style="${accentStyle(it)};--gx:${i % 2 ? "70%" : "30%"}">
    <div class="sticky">
      <div class="bg"></div>
      <div class="visual">${visualOf(it, "min(40vh,60vw)")}</div>
      <div class="text">
        <span class="tag reveal" style="--d:.1">${it.tag}</span>
        <h2 class="reveal" style="--d:.2">${it.title}</h2>
        <p class="reveal" style="--d:.35">${it.desc}</p>
        ${it.specs ? `<ul class="specs reveal" style="--d:.5">${it.specs.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
        ${linksOf(it).map(([label, href]) => `<a class="cta reveal" style="--d:.6" href="${href}" target="_blank" rel="noopener">${label}</a>`).join(" ")}
      </div>
    </div>
  </section>`;
};

const renderMini = (it, i, j) => {
  tiles.push({ ...it, href: `#s-${i}` });
  return `
  <article class="mini reveal" style="${accentStyle(it)};--d:${j * 0.25}">
    <div class="mglow"></div>
    <div class="mv">${visualOf(it, "min(16vh,20vw)")}</div>
    <div class="mt">
      <span class="tag">${it.tag}</span>
      <h3>${it.title}</h3>
      <p>${it.desc}</p>
      <div class="mfoot">
        ${it.budget ? `<span class="budget">${it.budget}</span>` : ""}
        ${linksOf(it).map(([label, href]) => `<a href="${href}" target="_blank" rel="noopener">${label}</a>`).join("")}
      </div>
    </div>
  </article>`;
};

document.getElementById("items").innerHTML = ITEMS.map((it, i) => {
  if (it.divider) return `
  <section class="divider" id="s-${i}"><div class="sticky"><h2 class="reveal">${it.divider}</h2></div></section>`;
  if (it.group) return `
  <section class="group" id="s-${i}"><div class="sticky"><div class="pair">${it.group.map((g, j) => renderMini(g, i, j)).join("")}</div></div></section>`;
  return renderBig(it, i);
}).join("");

const strip = html => html.replace(/<[^>]+>/g, "");
document.getElementById("grid").innerHTML = tiles.map((it, i) => `
  <a class="tile" href="${it.href}" style="--accent:${it.accent};transition-delay:${i * 60}ms">
    <div class="e">${it.emoji}</div>
    <h3>${strip(it.title)}</h3>
    <p>${strip(it.desc)}</p>
    ${it.budget ? `<span class="tb">${it.budget}</span>` : ""}
  </a>`).join("");

/* ---------- Scroll-driven animations ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => 1 - Math.pow(1 - t, 3);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hero = document.getElementById("hero");
const progress = document.getElementById("progress");
const sections = [...document.querySelectorAll(".item, .group, .divider")];

function onScroll() {
  const vh = innerHeight;
  hero.style.setProperty("--h", clamp(scrollY / vh));
  progress.style.transform = `scaleX(${clamp(scrollY / (document.documentElement.scrollHeight - vh))})`;

  for (const s of sections) {
    const r = s.getBoundingClientRect();
    if (r.bottom < -vh || r.top > vh * 2) continue;
    const p = clamp((vh - r.top) / r.height);
    const inn = reduced ? 1 : ease(clamp((p - 0.12) / 0.38));
    const out = reduced ? 0 : clamp((p - 0.85) / 0.15);
    s.style.setProperty("--in", inn.toFixed(4));
    s.style.setProperty("--out", out.toFixed(4));
  }
}
let ticking = false;
addEventListener("scroll", () => {
  if (!ticking) { requestAnimationFrame(() => { onScroll(); ticking = false; }); ticking = true; }
}, { passive: true });
addEventListener("resize", onScroll);
onScroll();

/* Tuiles du récap qui apparaissent */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => e.isIntersecting && e.target.classList.add("on"));
}, { threshold: 0.2 });
document.querySelectorAll(".tile").forEach(t => io.observe(t));

/* Carte holographique qui suit la souris / le doigt */
const front = document.querySelector(".tcard.front");
if (front) {
  const move = (x, y) => {
    const r = front.getBoundingClientRect();
    const px = clamp((x - r.left) / r.width), py = clamp((y - r.top) / r.height);
    front.style.setProperty("--ry", `${(px - 0.5) * 30}deg`);
    front.style.setProperty("--rx", `${(0.5 - py) * 30}deg`);
    front.style.setProperty("--mx", `${px * 100}%`);
    front.style.setProperty("--my", `${py * 100}%`);
  };
  const reset = () => ["--ry", "--rx"].forEach(k => front.style.setProperty(k, "0deg"));
  front.addEventListener("pointermove", e => move(e.clientX, e.clientY));
  front.addEventListener("pointerleave", reset);
}

/* ---------- Compte à rebours ---------- */
const cd = document.getElementById("countdown");
function tick() {
  const now = new Date();
  let xmas = new Date(now.getFullYear(), 11, 25);
  if (now > new Date(now.getFullYear(), 11, 26)) xmas = new Date(now.getFullYear() + 1, 11, 25);
  const diff = Math.max(0, xmas - now);
  const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
  cd.innerHTML = [[d, "jours"], [h, "heures"], [m, "min"], [s, "sec"]]
    .map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><small>${l}</small></div>`).join("");
}
tick(); setInterval(tick, 1000);

/* ---------- Neige ---------- */
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
let flakes = [];
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const count = Math.round(innerWidth * innerHeight / 9000);
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 2 + 0.5, s: Math.random() * 0.6 + 0.2, w: Math.random() * Math.PI * 2,
  }));
}
let lastY = scrollY;
function snow() {
  const dy = scrollY - lastY; lastY = scrollY;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.fillStyle = "rgba(255,255,255,.8)";
  for (const f of flakes) {
    f.w += 0.01;
    f.y += f.s * (1 + f.r) - dy * f.r * 0.15;
    f.x += Math.sin(f.w) * 0.3;
    if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
    if (f.y < -5) { f.y = innerHeight + 5; }
    ctx.globalAlpha = f.r / 2.5;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(snow);
}
if (!reduced) { resize(); addEventListener("resize", resize); snow(); }

/* ---------- Musique : « Douce nuit » en boîte à musique (Web Audio, aucun fichier) ---------- */
// Mélodie en 6/8 : [note, durée en croches]
const MELODY = [
  ["G4",3],["A4",1],["G4",2], ["E4",6], ["G4",3],["A4",1],["G4",2], ["E4",6],
  ["D5",4],["D5",2], ["B4",6], ["C5",4],["C5",2], ["G4",6],
  ["A4",4],["A4",2], ["C5",3],["B4",1],["A4",2], ["G4",3],["A4",1],["G4",2], ["E4",6],
  ["A4",4],["A4",2], ["C5",3],["B4",1],["A4",2], ["G4",3],["A4",1],["G4",2], ["E4",6],
  ["D5",4],["D5",2], ["F5",3],["D5",1],["B4",2], ["C5",6], ["E5",6],
  ["C5",3],["G4",1],["E4",2], ["G4",3],["F4",1],["D4",2], ["C4",12],
];
// Un accord par mesure (fondamentale, quinte, tierce)
const CHORDS = "C C C C G G C C F F C C F F C C G G C C C G C C".split(" ");
const CHORD_NOTES = { C: ["C3", "G3", "E4"], F: ["F2", "C3", "A3"], G: ["G2", "D3", "B3"] };
const EIGHTH = 0.3; // secondes

const freq = name => {
  const [, l, o] = name.match(/([A-G])(\d)/);
  const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[l];
  return 440 * Math.pow(2, (semis + (+o + 1) * 12 - 69) / 12);
};

let actx, master, bus, loopTimer, playing = false;

function setupAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0;
  // Petite réverbération générée (bruit qui décroît)
  const reverb = actx.createConvolver();
  const len = actx.sampleRate * 2.5;
  const impulse = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = impulse.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  reverb.buffer = impulse;
  const wet = actx.createGain(); wet.gain.value = 0.35;
  master.connect(actx.destination);
  master.connect(reverb); reverb.connect(wet); wet.connect(actx.destination);
}

function bell(t, f, vel, dest, decay = 2.2) {
  const env = actx.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(vel, t + 0.005);
  env.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  env.connect(dest);
  [[1, 1], [2, 0.25], [3.01, 0.06]].forEach(([mult, g]) => {
    const o = actx.createOscillator(), og = actx.createGain();
    o.frequency.value = f * mult; og.gain.value = g;
    o.connect(og); og.connect(env);
    o.start(t); o.stop(t + decay + 0.1);
  });
}

let nextStart = 0;
function scheduleLoop(start) {
  let pos = 0;
  for (const [note, dur] of MELODY) {
    bell(start + pos * EIGHTH, freq(note), 0.22, bus);
    pos += dur;
  }
  CHORDS.forEach((ch, m) => {
    CHORD_NOTES[ch].forEach((note, k) => bell(start + (m * 6 + k * 2) * EIGHTH, freq(note), 0.08, bus, 1.8));
  });
  nextStart = start + (pos + 6) * EIGHTH;
}

const musicBtn = document.getElementById("music");
function setMusic(on) {
  if (!actx) setupAudio();
  playing = on;
  const now = actx.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(master.gain.value, now);
  if (on) {
    actx.resume();
    // Un bus par lecture, qu'on débranche pour tout couper
    bus = actx.createGain(); bus.connect(master);
    scheduleLoop(now + 0.1);
    // Relance la boucle d'après en se calant sur l'horloge audio (robuste aux pauses d'onglet)
    loopTimer = setInterval(() => { if (actx.currentTime > nextStart - 1) scheduleLoop(nextStart); }, 500);
    master.gain.linearRampToValueAtTime(0.9, now + 1.5);
  } else {
    clearInterval(loopTimer);
    master.gain.linearRampToValueAtTime(0, now + 0.6);
    const old = bus;
    setTimeout(() => old && old.disconnect(), 700);
  }
  musicBtn.classList.toggle("on", on);
  musicBtn.classList.add("played");
  musicBtn.setAttribute("aria-pressed", on);
  musicBtn.setAttribute("aria-label", on ? "Couper la musique" : "Jouer la musique de Noël");
}
musicBtn.addEventListener("click", () => setMusic(!playing));
// Pause quand l'onglet est caché
document.addEventListener("visibilitychange", () => {
  if (!actx || !playing) return;
  document.hidden ? actx.suspend() : actx.resume();
});
</script>
